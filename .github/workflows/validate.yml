name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock HA dependency, lint, tests and lifecycle
        run: scripts/validate_stock_ha.sh
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        run: >-
          docker run --rm -v "$PWD:/github/workspace:ro"
          ghcr.io/home-assistant/hassfest@sha256:da6522993280166fe072704989a2b4c33e639e8ceb69c8ab6ad7ec5045c1a1e3
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS local schemas and brand assets
        run: >-
          docker run --rm --network none --entrypoint python -e PYTHONPATH=/hacs
          -v "$PWD:/github/workspace:ro"
          ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
          /github/workspace/scripts/hacs_local_check.py
      - name: HACS repository validation
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm -e INPUT_GITHUB_TOKEN -e GITHUB_REPOSITORY
          -e REPOSITORY_REF="$GITHUB_SHA"
          -e INPUT_CATEGORY=integration -e INPUT_REPOSITORY=eaceaser/ha-iaqualink-tcx
          -e INPUT_COMMENT=false -v "$PWD:/github/workspace:ro"
          ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
